name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # swift test needs the full Xcode toolchain: XCTest and its runner are
      # not part of Command Line Tools, and SwiftUI macro plugins ship with
      # Xcode only. macos-15 runners already have Xcode selected; the explicit
      # switch keeps that guarantee stable.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run unit tests
        run: |
          swift --version
          xcodebuild -version
          swift test 2>&1 | tee /tmp/swift-test.log
          echo "::group::test log tail"
          tail -60 /tmp/swift-test.log
          echo "::endgroup::"

      # Two brand contracts, both cheap, both silent if unenforced:
      #   * the brand green lives in the generator, Theme.swift and site.css;
      #   * the committed AppIcon PNGs must be reproducible from the generator
      #     (the v2 rewrite made code the source of truth — a hand-patched PNG
      #     breaks that premise and only shows up when someone regenerates).
      # The generator imports Pillow at module load. The runner's Python is
      # PEP 668 externally-managed, so `pip install` is refused outright —
      # a throwaway venv is the only thing that works without touching the
      # image's interpreter.
      - name: Check brand colour and icon assets are in sync
        run: |
          python3 -m venv .venv-icon
          .venv-icon/bin/pip install --quiet --disable-pip-version-check pillow
          .venv-icon/bin/python tools/generate_app_icon.py --check-brand
          .venv-icon/bin/python tools/generate_app_icon.py --verify-assets

      # The MAS channel compiles out Quit / Force Quit behind -D MAC_APP_STORE.
      # Without this job that branch only gets exercised when a tag is pushed,
      # so rot would surface at release time instead of in CI.
      - name: Build release (mas channel)
        run: swift build -c release --scratch-path .build -Xswiftc -D -Xswiftc MAC_APP_STORE

      - name: Build release (devid channel)
        run: swift build -c release --scratch-path .build
